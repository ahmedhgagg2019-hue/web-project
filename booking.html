<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinemaConnect · Book Tickets</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      /* ---- page-specific styles: Booking ---- */
      .booking-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        gap: 32px;
        align-items: start;
      }

      @media (max-width: 780px) {
        .booking-layout {
          grid-template-columns: 1fr;
        }
      }

      .booking-movie-card {
        background: var(--ink-2);
        border-radius: 10px;
        overflow: hidden;
      }

      .booking-movie-card img {
        width: 100%;
        aspect-ratio: 2 / 3;
        object-fit: cover;
        display: block;
      }

      .booking-movie-card > div {
        padding: 14px 16px 18px;
      }

      .booking-movie-card h2 {
        font-family: var(--f-display);
        font-size: 22px;
        margin: 0 0 8px;
        letter-spacing: 0.02em;
      }

      .booking-form h3 {
        font-family: var(--f-display);
        font-size: 18px;
        letter-spacing: 0.03em;
        color: var(--gold);
        margin: 0 0 12px;
      }

      .showtime-select {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 28px;
      }

      .showtime-btn {
        border: 1px solid rgba(241, 237, 228, 0.25);
        background: transparent;
        color: var(--paper);
        border-radius: 6px;
        padding: 10px 16px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      .showtime-btn:hover {
        border-color: var(--gold);
        color: var(--gold);
      }

      .showtime-btn.active {
        background: var(--marquee);
        border-color: var(--marquee);
        color: var(--paper);
      }

      .seat-map {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .seat-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .row-label {
        width: 18px;
        font-size: 12px;
        color: var(--paper-dim);
        flex-shrink: 0;
      }

      .seat {
        width: 30px;
        height: 30px;
        flex-shrink: 0;
        border-radius: 5px;
        border: 1px solid rgba(241, 237, 228, 0.25);
        background: transparent;
        color: var(--paper-dim);
        font-size: 11px;
        cursor: pointer;
      }

      .seat:hover:not(.seat-taken) {
        border-color: var(--gold);
        color: var(--gold);
      }

      .seat-selected {
        background: var(--teal);
        border-color: var(--teal);
        color: var(--ink);
        font-weight: 700;
      }

      .seat-taken {
        background: rgba(241, 237, 228, 0.08);
        color: rgba(241, 237, 228, 0.25);
        cursor: not-allowed;
      }

      .seat-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 18px;
        font-size: 13px;
        color: var(--paper-dim);
        margin-bottom: 28px;
      }

      .seat-legend span {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .legend-box {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(241, 237, 228, 0.25);
        display: inline-block;
      }

      .legend-box.available {
        background: transparent;
      }

      .legend-box.selected {
        background: var(--teal);
        border-color: var(--teal);
      }

      .legend-box.taken {
        background: rgba(241, 237, 228, 0.08);
      }

      .booking-summary {
        background: var(--ink-2);
        border-radius: 10px;
        padding: 20px 22px;
      }

      .booking-summary p {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .booking-summary strong {
        color: var(--gold);
      }

      .booking-summary .btn {
        margin-top: 6px;
      }

      .booking-summary .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .booking-msg {
        color: var(--marquee);
        font-size: 13px;
        margin-top: 10px !important;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="brand"
          >CINEMA<span class="dot">•</span>CONNECT</a
        >
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          ☰
        </button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-page="home">Home</a></li>
          <li><a href="browse.html" data-page="browse">Browse Movies</a></li>
          <li><a href="bookings.html" data-page="bookings">My Bookings</a></li>
          <li>
            <a
              href="admin.html"
              data-page="admin"
              id="adminNavLink"
              class="hidden"
              >Admin</a
            >
          </li>
        </ul>
        <div class="nav-cta" id="navCta"></div>
      </nav>
      <div class="filmstrip-rule"></div>
    </header>

    <main id="bookingMain">
      <!-- filled by js/booking.js -->
    </main>

    <footer class="site-footer">
      <div class="filmstrip-rule flip"></div>
      <div class="container">
        CinemaConnect · Web Development Summer Training 2026.
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/booking.js"></script>
    <script>
      ccRenderNav('booking');
    </script>
  </body>
</html>
