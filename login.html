<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CinemaConnect · Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --ink: #0e1016;
        --ink-2: #14161f;
        --paper: #f1ede4;
        --paper-dim: rgba(241, 237, 228, 0.65);
        --paper-muted: rgba(241, 237, 228, 0.35);
        --marquee: #c8392b;
        --gold: #d9a544;
        --teal: #4fb3a8;
        --f-display: 'Bebas Neue', 'Inter', sans-serif;
        --f-body: 'Inter', system-ui, -apple-system, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--ink);
        color: var(--paper);
        font-family: var(--f-body);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      a {
        color: var(--teal);
        text-decoration: none;
        transition: color 0.15s ease;
      }

      a:hover {
        color: var(--gold);
      }

      .hidden {
        display: none !important;
      }

      /* Filmstrip Rule */
      .filmstrip-rule {
        height: 10px;
        background-image: radial-gradient(
          circle at 8px 5px,
          var(--ink) 3px,
          transparent 3.5px
        );
        background-size: 20px 10px;
        background-repeat: repeat-x;
        background-color: var(--gold);
        opacity: 0.9;
      }

      .filmstrip-rule.flip {
        transform: scaleY(-1);
      }

      /* Navigation */
      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(14, 16, 22, 0.95);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(241, 237, 228, 0.08);
      }

      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        max-width: 1180px;
        margin: 0 auto;
      }

      .brand {
        font-family: var(--f-display);
        font-size: 28px;
        letter-spacing: 0.04em;
        color: var(--paper);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .brand .dot {
        color: var(--marquee);
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 28px;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .nav-links a {
        color: var(--paper-dim);
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .nav-links a:hover,
      .nav-links a.active {
        color: var(--gold);
      }

      .nav-toggle {
        display: none;
        background: none;
        border: none;
        color: var(--paper);
        font-size: 26px;
        cursor: pointer;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 22px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border: 1px solid transparent;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn-primary {
        background: var(--marquee);
        color: var(--paper);
      }

      .btn-primary:hover {
        background: #e04333;
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(200, 57, 43, 0.3);
      }

      /* Auth Form Card */
      .auth-section {
        padding: 72px 0 88px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 160px);
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        background: var(--ink-2);
        border-radius: 14px;
        border-top: 3px solid var(--gold);
        border-left: 1px solid rgba(241, 237, 228, 0.06);
        border-right: 1px solid rgba(241, 237, 228, 0.06);
        border-bottom: 1px solid rgba(241, 237, 228, 0.06);
        padding: 40px 36px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      }

      .auth-title {
        font-family: var(--f-display);
        font-size: 36px;
        letter-spacing: 0.02em;
        margin: 0 0 6px;
        color: var(--paper);
      }

      .auth-subtitle {
        color: var(--paper-dim);
        font-size: 14px;
        margin: 0 0 28px;
      }

      .auth-form .form-group {
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .auth-form label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--paper-dim);
      }

      .auth-form input {
        background: var(--ink);
        border: 1px solid rgba(241, 237, 228, 0.15);
        border-radius: 6px;
        padding: 12px 14px;
        color: var(--paper);
        font-family: var(--f-body);
        font-size: 14px;
        transition:
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }

      .auth-form input::placeholder {
        color: var(--paper-muted);
      }

      .auth-form input:focus {
        outline: none;
        border-color: var(--gold);
        box-shadow: 0 0 0 3px rgba(217, 165, 68, 0.15);
      }

      .auth-submit {
        width: 100%;
        margin-top: 10px;
        padding: 13px;
      }

      .form-error {
        background: rgba(200, 57, 43, 0.16);
        border: 1px solid rgba(200, 57, 43, 0.45);
        color: #ff9b8f;
        padding: 12px 14px;
        border-radius: 6px;
        font-size: 13px;
        margin-bottom: 20px;
      }

      .auth-switch {
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: var(--paper-dim);
      }

      .auth-switch a {
        font-weight: 600;
        color: var(--gold);
      }

      .auth-switch a:hover {
        text-decoration: underline;
      }

      /* Footer */
      .site-footer {
        padding: 30px 0 40px;
        text-align: center;
        color: var(--paper-dim);
        font-size: 13px;
      }

      .site-footer .filmstrip-rule {
        margin-bottom: 24px;
      }

      @media (max-width: 860px) {
        .nav-links {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          background: var(--ink-2);
          flex-direction: column;
          align-items: flex-start;
          padding: 20px 24px;
          gap: 16px;
          border-top: 1px solid rgba(241, 237, 228, 0.1);
          display: none;
        }

        .nav-links.open {
          display: flex;
        }

        .nav-toggle {
          display: block;
        }
      }

      @media (max-width: 480px) {
        .auth-card {
          padding: 32px 22px;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar">
        <a href="index.html" class="brand"
          >CINEMA<span class="dot">•</span>CONNECT</a
        >
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu">
          ☰
        </button>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html" data-page="home">Home</a></li>
          <li><a href="browse.html" data-page="browse">Browse Movies</a></li>
          <li><a href="bookings.html" data-page="bookings">My Bookings</a></li>
          <li>
            <a
              href="admin.html"
              data-page="admin"
              id="adminNavLink"
              class="hidden"
              >Admin</a
            >
          </li>
        </ul>
        <div class="nav-cta" id="navCta"></div>
      </nav>
      <div class="filmstrip-rule"></div>
    </header>

    <main>
      <section class="auth-section">
        <div class="auth-card">
          <h1 class="auth-title">Login</h1>
          <p class="auth-subtitle">Welcome back! Please enter your details.</p>

          <div id="loginError" class="form-error hidden" role="alert"></div>

          <form id="loginForm" class="auth-form" novalidate>
            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input
                type="email"
                id="loginEmail"
                name="email"
                placeholder="you@example.com"
                required
              />
            </div>

            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input
                type="password"
                id="loginPassword"
                name="password"
                placeholder="Enter your password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary auth-submit">
              Login
            </button>
          </form>

          <p class="auth-switch">
            Don't have an account? <a href="register.html">Register</a>
          </p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="filmstrip-rule flip"></div>
      <div class="container">
        CinemaConnect · Web Development Summer Training 2026.
      </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/auth.js"></script>
    <script>
      ccRenderNav('login');
    </script>
  </body>
</html>
